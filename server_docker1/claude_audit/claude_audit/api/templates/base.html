<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>{% block title %}Cloud Security AI 日志监控平台{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <img src="/static/logo.png" alt="logo" class="logo">
      <div class="brand-text">
        <div class="brand-title">Cloud Security</div>
        <div class="brand-sub">日志监控平台</div>
      </div>
    </div>
    <nav class="side-nav">
      <div class="nav-group">
        <div class="nav-group-title">总览</div>
        <a href="/dashboard" class="nav-item {% if active_page == 'dashboard' %}active{% endif %}">
          <span class="nav-icon">◉</span> 数据大屏
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">监控</div>
        <a href="/events" class="nav-item {% if active_page == 'events' %}active{% endif %}">
          <span class="nav-icon">■</span> 事件日志
        </a>
        <a href="/alerts" class="nav-item {% if active_page == 'alerts' %}active{% endif %}">
          <span class="nav-icon">▲</span> 告警命中
        </a>
        <a href="/review" class="nav-item {% if active_page == 'review' %}active{% endif %}">
          <span class="nav-icon">✦</span> 审查分析
        </a>
        <a href="/glm-monitor" class="nav-item {% if active_page == 'glm_monitor' %}active{% endif %}">
          <span class="nav-icon">◈</span> GLM 监控
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">管理</div>
        <a href="/rules" class="nav-item {% if active_page == 'rules' %}active{% endif %}">
          <span class="nav-icon">🛡</span> 安全策略
        </a>
        <a href="/plugins" class="nav-item {% if active_page == 'plugins' %}active{% endif %}">
          <span class="nav-icon">⬡</span> 插件管理
        </a>
        <a href="/plugin-status" class="nav-item {% if active_page == 'plugin_status' %}active{% endif %}">
          <span class="nav-icon">⚐</span> 插件状态
        </a>
        <a href="/settings" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
          <span class="nav-icon">⚙</span> 系统设置
        </a>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">数据</div>
        <a href="/stats" class="nav-item {% if active_page == 'stats' %}active{% endif %}">
          <span class="nav-icon">◆</span> 统计
        </a>
      </div>
    </nav>
    <div class="side-foot">Powered by Cloud Security Team</div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <div class="topbar-title">{% block topbar %}{% endblock %}</div>
      <div class="topbar-right">
        <span class="pill">v0.1</span>
        {% if request.session.get('user') %}
        <span style="font-size:12px;color:#475569;">👤 {{ request.session.get('user') }}</span>
        <form action="/logout" method="post" style="display:inline;margin:0;">
          <input type="hidden" name="_csrf" value="{{ request.session.get('csrf_token','') }}">
          <button type="submit" style="padding:4px 12px;font-size:12px;border:1px solid #cbd5e1;border-radius:4px;background:#fff;color:#475569;cursor:pointer;">登出</button>
        </form>
        {% endif %}
      </div>
    </header>
    <main class="content">
{% block body %}{% endblock %}
    </main>
  </div>
</div>
<script src="/static/refresh.js"></script>
</body>
</html>
