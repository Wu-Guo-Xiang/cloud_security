- id: cred_read_env_file
  when:
    tool: Read
  match:
    file_path_regex: (^|[\\/])\.env(\.|$)
  severity: high
  reason: Read 打开 .env 文件
- id: cred_edit_env_file
  when:
    tool: Edit
  match:
    file_path_regex: (^|[\\/])\.env(\.|$)
  severity: high
  reason: Edit 修改 .env 文件
- id: cred_touch_ssh_key
  when: {}
  match:
    file_path_regex: (id_rsa|id_ed25519|\.aws[\\/]credentials|\.kube[\\/]config)
  severity: critical
  reason: 触碰 SSH / AWS / kube 凭证文件
- id: cred_bash_leaks_api_key
  when:
    tool: Bash
  match:
    bash_command_regex: (sk-[A-Za-z0-9\-_]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[baprs]-[A-Za-z0-9-]{10,})
  severity: critical
  reason: Bash 命令行中出现类 API key 明文
- id: cred_windows_secret_paths
  when: {}
  match:
    file_path_regex: (SAM|SYSTEM|SECURITY|NTDS\.dit)$
  severity: critical
  reason: 触碰 Windows 敏感注册表 / 域数据库
