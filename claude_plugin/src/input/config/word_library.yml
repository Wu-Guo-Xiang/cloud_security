# 公司业务词库
#
# 用法：键为 rules.yml/data_classes 中的类目名；值为该类目的关键词列表。
# 匹配方式：精确子串、大小写敏感。命中数累加为该类目 Match.count。
#
# 维护节奏：每两周由业务方更新（与主方案 Phase 4 节奏对齐）。
# 占位示例已注释，正式上线前由安全运营填充真实业务词。

# customer_name:
#   - "示例客户A"
#   - "示例客户B"

# 不在 rules.yml 中的自定义类目也可加入；命中后仍会写入日志，便于审计观察是否需要新增类目。
# internal_project:
#   - "Phoenix"
#   - "Apollo"
